<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Академията — Лични рекорди</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12241a;
    --forest:#194b2c;
    --grass:#2f8c46;
    --bright:#6fce52;
    --chalk:#f4f1e6;
    --chalk-dim:#e7e2d1;
    --gold:#c89b3c;
    --line: rgba(20,40,28,0.12);
    --shadow: 0 10px 30px rgba(15,30,20,0.18);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .display{font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* ---------- Brushstroke stripe motif (recurring signature element, echoes the club mark) ---------- */
  .stripes{
    background-image: repeating-linear-gradient(
      115deg,
      var(--bright) 0px, var(--bright) 26px,
      var(--forest) 26px, var(--forest) 52px,
      var(--ink) 52px, var(--ink) 60px,
      var(--forest) 60px, var(--forest) 86px
    );
    background-size: 300px 300px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 6vw;
    background:var(--ink);
    color:var(--chalk);
    position:sticky;
    top:0;
    z-index:50;
    border-bottom:3px solid var(--bright);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand img{width:44px; height:44px; display:block; border-radius:50%;}
  .brand-name{font-size:1.05rem; letter-spacing:0.08em;}
  .brand-name small{
    display:block;
    font-family:'Work Sans', sans-serif;
    text-transform:none;
    letter-spacing:0.02em;
    font-size:0.65rem;
    color: var(--bright);
    font-weight:600;
    margin-top:2px;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    background:var(--ink);
    color:var(--chalk);
    overflow:hidden;
    padding:96px 6vw 70px;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:0.16;
    background-image: repeating-linear-gradient(
      115deg,
      var(--bright) 0px, var(--bright) 3px,
      transparent 3px, transparent 46px
    );
  }
  .hero-inner{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:56px;
    max-width:1180px;
    margin:0 auto;
  }
  .hero-badge img{
    width:172px; height:172px;
    display:block;
    border-radius:50%;
    flex-shrink:0;
    box-shadow: 0 0 0 4px rgba(111,206,82,0.35), var(--shadow);
  }
  .hero-copy .eyebrow{
    font-family:'JetBrains Mono', monospace;
    color:var(--bright);
    font-size:0.8rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .hero-copy h1{
    font-size:clamp(2.6rem, 6vw, 4.6rem);
    line-height:0.94;
    margin:0 0 18px;
  }
  .hero-copy h1 span{color:var(--bright);}
  .hero-copy p{
    max-width:520px;
    color:#cfd8cf;
    font-size:1.05rem;
    line-height:1.55;
    margin:0;
  }

  /* ---------- Stat strip ---------- */
  .stats{
    max-width:1180px;
    margin:-42px auto 0;
    position:relative;
    z-index:3;
    padding:0 6vw;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
  }
  .stat-card{
    background:var(--chalk);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 22px;
    box-shadow:var(--shadow);
    border-top:4px solid var(--grass);
  }
  .stat-card .label{
    font-size:0.68rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--forest);
    font-weight:600;
    margin-bottom:8px;
  }
  .stat-card .value{
    font-family:'JetBrains Mono', monospace;
    font-size:1.5rem;
    font-weight:700;
    color:var(--ink);
  }
  .stat-card .sub{
    font-size:0.8rem;
    color:#5b6b5e;
    margin-top:4px;
  }

  /* ---------- Table section ---------- */
  .records{
    max-width:1180px;
    margin:64px auto 100px;
    padding:0 6vw;
  }
  .records-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:22px;
    gap:20px;
    flex-wrap:wrap;
  }
  .records-head h2{
    font-size:clamp(1.8rem, 3.4vw, 2.6rem);
    margin:0;
  }
  .records-head p{
    margin:6px 0 0;
    color:#5b6b5e;
    font-size:0.95rem;
  }
  .divider{
    height:6px;
    border-radius:3px;
    margin:18px 0 30px;
  }

  .table-wrap{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:14px;
    overflow-x:auto;
    box-shadow:var(--shadow);
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:720px;
  }
  thead th{
    text-align:left;
    background:var(--forest);
    color:var(--chalk);
    padding:0;
    user-select:none;
  }
  thead th button{
    all:unset;
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding:16px 16px;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.82rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  thead th button:hover{ background:rgba(255,255,255,0.08); }
  thead th button:focus-visible{ outline:2px solid var(--bright); outline-offset:-2px; }
  thead th.rank-col button{cursor:default; padding-left:20px;}

  .caret{
    width:10px; height:10px;
    display:inline-flex;
    opacity:0.35;
    transition:opacity .15s, transform .15s;
    flex-shrink:0;
  }
  th[data-active="true"] .caret{ opacity:1; }
  th[data-dir="desc"] .caret{ transform:rotate(180deg); }

  tbody tr{
    border-top:1px solid var(--line);
    transition:background .12s;
  }
  tbody tr:hover{ background:rgba(111,206,82,0.10); }
  tbody tr:nth-child(1) .rank-badge{ background:var(--gold); color:#3a2a05; }
  tbody tr:nth-child(2) .rank-badge{ background:#c8ccc7; color:#2a2a2a; }
  tbody tr:nth-child(3) .rank-badge{ background:#c98a4b; color:#2a1a05; }

  td{
    padding:13px 16px;
    font-size:0.95rem;
    vertical-align:middle;
    white-space:nowrap;
  }
  td.rank-col{ width:56px; }
  .rank-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px; height:28px;
    border-radius:50%;
    background:var(--chalk-dim);
    color:var(--forest);
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    font-weight:700;
  }
  td.name-col{ font-weight:600; white-space:normal; }
  td.time-col{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    color:var(--ink);
  }
  td.time-col.empty{ color:#9aa39b; font-weight:500; }

  /* asterisk / tooltip (works both next to a name and next to a time value) */
  .split-flag{
    display:inline-block;
    margin-left:4px;
    color:var(--grass);
    font-weight:700;
    cursor:help;
    position:relative;
  }
  .split-flag .bubble{
    position:absolute;
    bottom:130%;
    left:50%;
    transform:translateX(-50%) translateY(4px);
    background:var(--ink);
    color:var(--chalk);
    font-family:'Work Sans', sans-serif;
    font-weight:500;
    font-size:0.78rem;
    line-height:1.4;
    padding:8px 12px;
    border-radius:8px;
    white-space:normal;
    width:max-content;
    max-width:220px;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .15s, transform .15s;
    z-index:10;
  }
  .split-flag .bubble::after{
    content:"";
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--ink);
  }
  .split-flag:hover .bubble,
  .split-flag:focus .bubble{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  footer{
    background:var(--ink);
    color:#aab6ac;
    text-align:center;
    padding:30px 6vw 34px;
    font-size:0.85rem;
  }
  footer strong{ color:var(--bright); }

  @media (max-width: 760px){
    .hero-inner{ flex-direction:column; align-items:flex-start; gap:26px; }
    .hero-badge img{ width:110px; height:110px; }
    .stats{ grid-template-columns:1fr 1fr; margin-top:-24px; }
    thead th button{ padding:12px 10px; font-size:0.7rem; }
    td{ padding:12px 10px; font-size:0.86rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="rank-col"><button type="button">#</button></th>
          <th id="th-name" data-key="name" data-active="false" data-dir="asc">
            <button type="button" onclick="sortBy('name')">
              Име
              <svg class="caret" viewBox="0 0 10 10"><path d="M1 3 L5 8 L9 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </th>
          <th id="th-marathon" data-key="marathon" data-active="true" data-dir="asc">
            <button type="button" onclick="sortBy('marathon')">
              Маратон
              <svg class="caret" viewBox="0 0 10 10"><path d="M1 3 L5 8 L9 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </th>
          <th id="th-half" data-key="half" data-active="false" data-dir="asc">
            <button type="button" onclick="sortBy('half')">
              Полумаратон
              <svg class="caret" viewBox="0 0 10 10"><path d="M1 3 L5 8 L9 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </th>
          <th id="th-ten" data-key="ten" data-active="false" data-dir="asc">
            <button type="button" onclick="sortBy('ten')">
              10 км
              <svg class="caret" viewBox="0 0 10 10"><path d="M1 3 L5 8 L9 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </th>
          <th id="th-five" data-key="five" data-active="false" data-dir="asc">
            <button type="button" onclick="sortBy('five')">
              5 км
              <svg class="caret" viewBox="0 0 10 10"><path d="M1 3 L5 8 L9 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>

<footer>
  <div class="display" style="letter-spacing:0.1em; font-size:1rem; color:var(--chalk); margin-bottom:6px;">АКАДЕМИЯТА</div>
  Лични рекорди на клуба · водено ръчно, обновявано след всяко PR &nbsp;·&nbsp; <strong>*</strong> = разделено/междинно време
</footer>

<script>
  const TIME_COLUMNS = ["marathon", "half", "ten", "five"];

  function parseTimeValue(raw){
    // returns { seconds, isSplit, display }
    if(!raw) return { seconds:null, isSplit:false, display:null };
    const isSplit = raw.trim().endsWith("*");
    const clean = isSplit ? raw.trim().slice(0, -1) : raw.trim();
    const parts = clean.split(":").map(Number);
    let seconds = null;
    if(parts.length === 3 && !parts.some(isNaN)) seconds = parts[0]*3600 + parts[1]*60 + parts[2];
    else if(parts.length === 2 && !parts.some(isNaN)) seconds = parts[0]*60 + parts[1];
    return { seconds, isSplit, display: clean };
  }

  const DEFAULT_SPLIT_NOTE = "междинно време";

  let sortKey = "marathon";
  let sortDir = "asc";

  function sortBy(key){
    if(sortKey === key){
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortKey = key;
      sortDir = "asc";
    }
    render();
  }

  // When sorting by marathon and neither runner has a marathon time, rank
  // them against each other using the next best available PR instead of
  // leaving them in original array order: half marathon, then 10K, then 5K.
  const MARATHON_FALLBACK_CHAIN = ["half", "ten", "five"];

  function compareFallbackChain(a, b, dir){
    for(const key of MARATHON_FALLBACK_CHAIN){
      const av = parseTimeValue(a[key]).seconds;
      const bv = parseTimeValue(b[key]).seconds;
      if(av === null && bv === null) continue; // neither has this distance, try the next one
      if(av === null) return 1;   // missing this distance sinks below one that has it
      if(bv === null) return -1;
      if(av !== bv) return dir === "asc" ? av - bv : bv - av;
    }
    return 0; // no distance available at all for either runner
  }

  function compareTimeColumn(a, b, key, dir){
    const av = parseTimeValue(a[key]).seconds;
    const bv = parseTimeValue(b[key]).seconds;

    // runners missing this column's time always sink to the bottom, in either direction
    if(av === null && bv === null){
      return key === "marathon" ? compareFallbackChain(a, b, dir) : 0;
    }
    if(av === null) return 1;
    if(bv === null) return -1;

    return dir === "asc" ? av - bv : bv - av;
  }

  function getSorted(){
    const arr = [...runners];
    arr.sort((a, b) => {
      if(TIME_COLUMNS.includes(sortKey)){
        return compareTimeColumn(a, b, sortKey, sortDir);
      }
      const av = a[sortKey].toLowerCase();
      const bv = b[sortKey].toLowerCase();
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return sortDir === "asc" ? cmp : -cmp;
    });
    return arr;
  }

  function updateHeaderState(){
    ["name", ...TIME_COLUMNS].forEach(key => {
      const th = document.getElementById(key === "name" ? "th-name" : "th-" + key);
      th.dataset.active = (sortKey === key).toString();
      th.dataset.dir = sortKey === key ? sortDir : "asc";
    });
  }

  function timeCellHtml(record, key){
    const raw = record[key];
    const parsed = parseTimeValue(raw);
    if(parsed.display === null){
      return `<td class="time-col empty">—</td>`;
    }
    let flag = "";
    if(parsed.isSplit){
      const note = (record.notes && record.notes[key]) || DEFAULT_SPLIT_NOTE;
      flag = `<span class="split-flag" tabindex="0">*<span class="bubble">${escapeHtml(note)}</span></span>`;
    }
    return `<td class="time-col">${parsed.display}${flag}</td>`;
  }

  function render(){
    updateHeaderState();
    const tbody = document.getElementById("tbody");
    const sorted = getSorted();
    tbody.innerHTML = sorted.map((r, i) => {
      const nameFlag = r.split
        ? `<span class="split-flag" tabindex="0">*<span class="bubble">${escapeHtml(r.asteriskText || DEFAULT_SPLIT_NOTE)}</span></span>`
        : "";
      return `
        <tr>
          <td class="rank-col"><span class="rank-badge">${i+1}</span></td>
          <td class="name-col">${escapeHtml(r.name)}${nameFlag}</td>
          ${timeCellHtml(r, "marathon")}
          ${timeCellHtml(r, "half")}
          ${timeCellHtml(r, "ten")}
          ${timeCellHtml(r, "five")}
        </tr>`;
    }).join("");

    document.getElementById("runnerCount").textContent =
      `${runners.length} бегачи · подредено по ${columnLabel(sortKey)} (${sortDir === "asc" ? "възходящо" : "низходящо"})`;

    renderStats();
  }

  function columnLabel(key){
    return { name:"име", marathon:"маратонско време", half:"полумаратонско време", ten:"10К време", five:"5К време" }[key] || key;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function bestOf(key, label){
    const candidates = runners
      .map(r => ({ r, seconds: parseTimeValue(r[key]).seconds }))
      .filter(x => x.seconds !== null);
    if(candidates.length === 0) return { value:"—", name:"няма данни" };
    const best = candidates.reduce((a, b) => b.seconds < a.seconds ? b : a);
    return { value: parseTimeValue(best.r[key]).display, name: best.r.name };
  }

  function renderStats(){
    const m = bestOf("marathon");
    const h = bestOf("half");
    const t = bestOf("ten");
    const f = bestOf("five");

    document.getElementById("statsRow").innerHTML = `
      <div class="stat-card">
        <div class="label">Най-бърз маратон</div>
        <div class="value">${m.value}</div>
        <div class="sub">${m.name}</div>
      </div>
      <div class="stat-card">
        <div class="label">Най-бърз полумаратон</div>
        <div class="value">${h.value}</div>
        <div class="sub">${h.name}</div>
      </div>
      <div class="stat-card">
        <div class="label">Най-бързи 10 км</div>
        <div class="value">${t.value}</div>
        <div class="sub">${t.name}</div>
      </div>
      <div class="stat-card">
        <div class="label">Най-бързи 5 км</div>
        <div class="value">${f.value}</div>
        <div class="sub">${f.name}</div>
      </div>
    `;
  }

  render();
</script>

</body>
</html>
